[package]
name = "aulora-desktop"
version = "0.0.0"
description = "Aulora desktop shell (Tauri 2) wrapping the web client."
authors = ["Aulora"]
license = "SEE LICENSE IN LICENSE AND COMMERCIAL.md"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aulora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Used by `tauri build` for production; the desktop shell loads the bundled web
# client instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]
