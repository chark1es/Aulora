<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Inter (Latin) from packages/tokens/fonts; Vite fingerprints it to the
         same /assets URL the @font-face rule in the Tailwind base layer uses. -->
    <link
      rel="preload"
      href="../../packages/tokens/fonts/web/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Aulora</title>
    <!-- External so the desktop shell can enforce `script-src 'self'`. The
         palette variables themselves are injected by Vite from @aulora/tokens. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
