name: Feature request
description: Explain a problem you want Aulora to solve.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters this problem and what are they trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the outcome, relevant platforms, and any alternatives you considered.
    validations:
      required: true
