name: Desktop

# Builds the Tauri 2 shell on macOS, Windows and Linux. Rust is unavailable in
# the authoring environment, so this workflow is the compile/bundle gate for
# apps/desktop; on-device behaviour still needs a manual pass.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            pkg-config \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install JS dependencies
        run: bun install

      - name: Verify desktop configuration
        working-directory: apps/desktop
        run: bun run verify

      - name: Generate platform icons
        working-directory: apps/desktop
        run: bun run icons

      # `tauri build` runs `beforeBuildCommand`, which builds apps/web, then
      # compiles the Rust shell and bundles it per the platform config.
      - name: Build desktop bundle
        working-directory: apps/desktop
        run: bun run tauri:build

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aulora-desktop-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
