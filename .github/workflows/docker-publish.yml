name: Publish Docker images

# Builds the server images from a published release tag and pushes them to
# GitHub Container Registry, so a server can run Aulora without cloning the
# repository. Also attaches the self-host bundle (compose files + .env.example)
# to the GitHub release.
#
# Called by release.yml after the release is published. A release created with
# GITHUB_TOKEN does not trigger `release:` workflows, hence workflow_call.
# Run it by hand to rebuild the images for an existing release tag.

on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v, for example 1.3.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 1.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        image: [web, setup, bot-runner, backup, smtp-gateway, push-relay]
        # Each entry matches the combinations with that image and adds its build inputs.
        include:
          - { image: web, context: ., file: infra/docker/web.Dockerfile }
          - { image: setup, context: ., file: infra/docker/setup.Dockerfile }
          - { image: bot-runner, context: ., file: infra/docker/bot-runner.Dockerfile }
          - { image: backup, context: ., file: infra/docker/backup/backup.Dockerfile }
          - { image: smtp-gateway, context: ., file: infra/docker/smtp-gateway/Dockerfile }
          - { image: push-relay, context: infra/push-relay, file: infra/push-relay/Dockerfile }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Name the image
        id: name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aulora-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          # Plain manifests keep the per-architecture digests mergeable below.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ steps.name.outputs.ref }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=aulora-${{ matrix.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [web, setup, bot-runner, backup, smtp-gateway, push-relay]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-architecture tags
        env:
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ inputs.version }}
        run: |
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/aulora-${IMAGE}"
          # 1.3.0 -> 1.3.0, 1.3, 1, latest. A prerelease (1.3.0-rc.1) gets only its own tag.
          tags=("$VERSION")
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
            tags+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}" latest)
          fi
          args=()
          for tag in "${tags[@]}"; do args+=(-t "${ref}:${tag}"); done
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do sources+=("${ref}@sha256:$(basename "$digest")"); done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${ref}:${VERSION}"

  bundle:
    name: Attach the self-host bundle
    needs: merge
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          persist-credentials: false
      - name: Package compose files
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          dir="$RUNNER_TEMP/aulora"
          mkdir -p "$dir"
          cd infra/docker
          cp docker-compose.yml docker-compose.images.yml .env.example "$dir/"
          cp -r initdb livekit vault proxy "$dir/"
          cd "$dir"
          {
            printf '\n# ---------------------------------------------------------------------------\n'
            printf '# Prebuilt images (added by the release bundle)\n'
            printf '# ---------------------------------------------------------------------------\n'
            printf '# Pull the published images instead of building. To upgrade, change\n'
            printf '# AULORA_VERSION, then run: docker compose pull && docker compose up -d\n'
            printf 'COMPOSE_FILE=docker-compose.yml:docker-compose.images.yml\n'
            printf 'AULORA_VERSION=%s\n' "$VERSION"
            printf 'AULORA_IMAGE_REGISTRY=%s\n' "$registry"
          } >> .env.example
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/aulora-selfhost-${VERSION}.tar.gz" aulora
      - name: Upload to the release
        run: gh release upload "v${VERSION}" "$RUNNER_TEMP/aulora-selfhost-${VERSION}.tar.gz" --clobber
