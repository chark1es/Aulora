name: Docker images

# Builds the Aulora images for linux/amd64 and linux/arm64 on native runners and
# publishes them to ghcr.io/<owner>/aulora-*.
#
#   build         every image x platform pushes by digest only (no tag)
#   manifest      one multi-arch manifest per image, tagged sha-<commit>
#   release-tags  re-tags that manifest X.Y.Z, X.Y, X and latest
#
# Release automation calls this twice: `images` builds and pushes sha-<commit>
# alongside the desktop and mobile builds, and `tag-images` adds the version tags
# only after every other artifact is built, just before the GitHub release is
# published. Run it manually to build an image set or to re-publish the tags of an
# existing release (set `ref` to its vX.Y.Z tag, push and release-tags on).

on:
  workflow_call:
    inputs:
      version:
        description: Aulora version for labels and release tags (default is the checked-out version)
        type: string
        default: ''
      ref:
        description: Commit or tag to build (default is the caller's commit)
        type: string
        default: ''
      push:
        description: Push to GitHub Container Registry
        type: boolean
        default: false
      build:
        description: Build the images (off to only apply release tags to existing sha-<commit> images)
        type: boolean
        default: true
      release-tags:
        description: Tag X.Y.Z, X.Y, X and latest on the sha-<commit> images
        type: boolean
        default: false
      platforms:
        description: Comma-separated build platforms
        type: string
        default: linux/amd64,linux/arm64
  workflow_dispatch:
    inputs:
      version:
        description: Aulora version (empty uses the checked-out version)
        type: string
        default: ''
      ref:
        description: Commit or tag to build, for example v1.6.2 (empty uses the selected ref)
        type: string
        default: ''
      push:
        description: Push to GitHub Container Registry
        type: boolean
        default: false
      build:
        description: Build the images (off to only apply release tags)
        type: boolean
        default: true
      release-tags:
        description: Tag X.Y.Z, X.Y, X and latest (requires push; ref must be that version's tag)
        type: boolean
        default: false
      platforms:
        description: Comma-separated build platforms
        type: string
        default: linux/amd64,linux/arm64

permissions:
  contents: read

jobs:
  prepare:
    name: Plan images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      namespace: ${{ steps.plan.outputs.namespace }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      matrix: ${{ steps.plan.outputs.matrix }}
      images: ${{ steps.plan.outputs.images }}
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          # Full history and tags: release tags only move forward.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Plan the build
        id: plan
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          PUSH: ${{ inputs.push }}
          RELEASE_TAGS: ${{ inputs.release-tags }}
          CALLER: ${{ github.workflow }}
        run: |
          set -euo pipefail
          source_version="$(sed -n 's/^export const AULORA_VERSION = "\([^"]*\)";.*/\1/p' packages/convex/convex/lib/env.ts)"
          version="${INPUT_VERSION:-$source_version}"
          sha="$(git rev-parse HEAD)"
          if [ "$PUSH" = true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Images are published from main only (this run is on ${GITHUB_REF})."
            exit 1
          fi
          if [ "$RELEASE_TAGS" = true ]; then
            [ "$PUSH" = true ] || { echo "::error::release-tags needs push"; exit 1; }
            # A published release's tag must point at the commit being tagged. Only
            # the Release workflow may tag a version whose git tag does not exist
            # yet (it creates the tag after the images are tagged).
            if tag_commit="$(git rev-parse --verify "refs/tags/v${version}^{commit}" 2>/dev/null)"; then
              [ "$tag_commit" = "$sha" ] ||
                { echo "::error::ref must be the v${version} tag (${tag_commit}), not ${sha}"; exit 1; }
            elif [ "$CALLER" != Release ]; then
              echo "::error::Release v${version} does not exist"
              exit 1
            fi
            existing="$(git tag --list 'v*' | tr '\n' ' ')"
            tags="$(node scripts/ci/docker.mjs tags --version "$version" --existing "$existing" | jq -R . | jq -sc .)"
          else
            node scripts/ci/docker.mjs tags --version "$version" >/dev/null # validates the version
            tags='[]'
          fi
          {
            echo "namespace=ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')"
            echo "version=$version"
            echo "sha=$sha"
            echo "matrix=$(node scripts/ci/docker.mjs matrix --platforms "$PLATFORMS")"
            echo "images=$(node scripts/ci/docker.mjs images)"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  # Without push: build only, which needs no registry access.
  build-check:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    if: ${{ inputs.build && !inputs.push }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/docker-image
        with:
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          platform: ${{ matrix.platform }}
          namespace: ${{ needs.prepare.outputs.namespace }}
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.sha }}

  build:
    name: Push ${{ matrix.image }} (${{ matrix.arch }})
    needs: prepare
    if: ${{ inputs.build && inputs.push }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/docker-image
        with:
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          platform: ${{ matrix.platform }}
          namespace: ${{ needs.prepare.outputs.namespace }}
          version: ${{ needs.prepare.outputs.version }}
          revision: ${{ needs.prepare.outputs.sha }}
          push: 'true'
          token: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish ${{ matrix.image }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-arch manifest
        env:
          IMAGE: ${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create --tag "${IMAGE}:sha-${SHA}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:sha-${SHA}"

  release-tags:
    name: Tag ${{ matrix.image }}
    needs: [prepare, manifest]
    # `manifest` is skipped when only tagging an already built commit.
    if: ${{ !cancelled() && !failure() && inputs.push && inputs.release-tags }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the release
        env:
          IMAGE: ${{ needs.prepare.outputs.namespace }}/${{ matrix.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for tag in $(jq -r '.[]' <<< "$TAGS"); do args+=(--tag "${IMAGE}:${tag}"); done
          # Fails when the commit was never built: a release never gets tags without images.
          docker buildx imagetools create "${args[@]}" "${IMAGE}:sha-${SHA}"
          docker buildx imagetools inspect "${IMAGE}:$(jq -r '.[0]' <<< "$TAGS")"
