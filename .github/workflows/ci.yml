name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      native:
        description: Build the desktop, Android and iOS apps
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      native:
        description: Build the desktop, Android and iOS apps
        type: boolean
        default: true

# Only pull requests are filtered by the paths they touch. Pushes to main, merge
# groups, manual runs and release calls run every check, so main and the release
# commit are always fully verified. The `required` job is the single required
# status: it passes when every job succeeded or was skipped by its path filter.
#
# Native builds default on for manual runs and workflow calls. Pull requests run
# them when `build-native` is labeled or the native project paths changed.
# Releases pass native: false because their signed native builds already gate
# publication.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
      docs: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docs == 'true' }}
      infra: ${{ github.event_name != 'pull_request' || steps.filter.outputs.infra == 'true' }}
      release-scripts: ${{ github.event_name != 'pull_request' || steps.filter.outputs.release-scripts == 'true' }}
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      docker: ${{ github.event_name != 'pull_request' || steps.filter.outputs.docker == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
      docker-matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Only the matrix generator, so this job stays a few seconds long.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/ci/docker.mjs
            apps/desktop/scripts/release-version.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Image build matrix for pull requests
        id: matrix
        run: echo "matrix=$(node scripts/ci/docker.mjs matrix --platforms linux/amd64)" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            code:
              - 'apps/web/**'
              - 'apps/mobile/**'
              - 'apps/desktop/**'
              - 'apps/docs/lib/**'
              - 'apps/docs/scripts/**'
              - 'apps/docs/static/**'
              - 'apps/docs/landing/**'
              - 'apps/docs/package.json'
              - 'apps/docs/biome.json'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig*.json'
              - 'biome.json*'
              - '.github/actions/setup-js/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - '**/*.md'
              - 'scripts/check-docs.mjs'
            infra:
              - 'infra/**'
              - 'install.sh'
              - 'install.ps1'
              - 'packages/core/**'
              - 'package.json'
              - '.github/workflows/ci.yml'
            release-scripts:
              - 'scripts/**'
              - 'apps/desktop/scripts/**'
              - 'apps/desktop/src-tauri/**'
              - 'infra/docker/docker-compose*.yml'
              - 'infra/docker/backup/backup.sh'
              - '.dockerignore'
              - 'LICENSE'
              - 'NOTICE'
              - 'COMMERCIAL.md'
              - 'CLA.md'
              - 'SECURITY.md'
              - 'THIRD_PARTY_NOTICES.md'
              - 'package.json'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'
            docker:
              - 'infra/**'
              - '.dockerignore'
              - 'package.json'
              - 'bun.lock'
              - 'scripts/ci/docker.mjs'
              - '.github/workflows/ci.yml'
              - '.github/actions/docker-image/**'
              - '.github/workflows/docker.yml'
            desktop:
              - 'apps/desktop/**'
              - '.github/workflows/desktop.yml'
            android:
              - 'apps/mobile/android/**'
              - 'apps/mobile/app.json'
              - 'apps/mobile/app.config.*'
              - 'apps/mobile/package.json'
            ios:
              - 'apps/mobile/ios/**'
              - 'apps/mobile/app.json'
              - 'apps/mobile/app.config.*'
              - 'apps/mobile/package.json'

  quality:
    name: Tests and types
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      # Turbo replays unchanged lint, typecheck, test and build tasks from here.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            turbo-${{ runner.os }}-
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: Bundle size and lazy-loading budget
        run: bun run perf:bundle
      - name: Desktop embed budget
        run: bun run perf:embed

  docs:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      # Builds only the docs site; the workspace build runs in `quality`.
      - run: bun run docs:check
      - name: Documentation generator tests
        run: bun run --cwd apps/docs test

  release-tests:
    name: Release metadata and scripts
    needs: changes
    if: needs.changes.outputs.release-scripts == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: bun run release:check
      - name: Release automation tests
        run: bun run test:release

  infra-tests:
    name: Infrastructure tests
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: bun run test:infra

  workflows:
    name: Workflow validation
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The image bundles shellcheck and pyflakes for `run:` scripts.
      - name: Check workflow syntax and shell scripts
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  docker:
    name: Image build (${{ matrix.image }})
    needs: changes
    # Builds without pushing and with read-only permissions. Pushing lives in docker.yml.
    if: github.event_name == 'pull_request' && needs.changes.outputs.docker == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.docker-matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-image
        with:
          image: ${{ matrix.image }}
          dockerfile: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          platform: ${{ matrix.platform }}
          namespace: ghcr.io/${{ github.repository_owner }}
          version: pr-${{ github.event.pull_request.number }}
          revision: ${{ github.sha }}

  desktop:
    needs: changes
    if: ${{ inputs.native || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'build-native') || needs.changes.outputs.desktop == 'true')) }}
    uses: ./.github/workflows/desktop.yml

  android:
    name: Android compile
    needs: changes
    if: ${{ inputs.native || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'build-native') || needs.changes.outputs.android == 'true')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17.0.21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # SDK 58 compiles against API 37 and build-tools 37.
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # Cache downloaded dependencies, never Gradle's build cache, so task
          # outputs cannot leak between CI and release builds.
          gradle-home-cache-excludes: caches/build-cache-1
      - name: Compile debug APK without release secrets
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

  ios:
    name: iOS compile
    needs: changes
    if: ${{ inputs.native || (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'build-native') || needs.changes.outputs.ios == 'true')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Verify portable podspec checksums
        run: ruby scripts/ci/podspec-checksums.test.rb
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/mobile/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-${{ runner.arch }}-
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Compile unsigned simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Aulora.xcworkspace -scheme Aulora -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-ci" ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build

  secrets:
    name: Secret history scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      PR_COMMITS: ${{ github.event_name == 'pull_request' && github.event.pull_request.commits || 0 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out its merge commit: scan only what the PR
          # adds (HEAD^1..HEAD^2) and fetch just that much history. Every other
          # event scans the full history.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false
      - name: Fetch the pull request's commits
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --deepen="$PR_COMMITS" origin
      - name: Scan Git history with reviewed fixture exceptions
        run: |
          set -euo pipefail
          range=()
          if [ "$PR_COMMITS" != 0 ]; then
            range=(--log-opts="HEAD^1..HEAD^2")
          fi
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact=100 "${range[@]}"

  required:
    name: Required checks
    if: always()
    needs: [changes, quality, docs, release-tests, infra-tests, workflows, docker, desktop, android, ios, secrets]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          # Path detection and the secret scan always run. Every other job may be
          # skipped: by a path filter, or by the native-build opt-in.
          always_run = {'changes', 'secrets'}
          allowed = lambda name, job: job['result'] == 'success' or (name not in always_run and job['result'] == 'skipped')
          failures = [name for name, job in json.loads(os.environ['RESULTS']).items() if not allowed(name, job)]
          if failures:
              print('Required checks failed: ' + ', '.join(failures))
              sys.exit(1)
          print('All required checks passed.')
          PY
