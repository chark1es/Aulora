name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:
  workflow_call:
    inputs:
      native:
        description: Build the desktop, Android and iOS apps
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      native:
        description: Build the desktop, Android and iOS apps
        type: boolean
        default: true

# Native builds are slow and expensive. They run for releases, manual runs, and
# pull requests labeled `build-native`.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests and types
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run docs:check
      - run: bun run release:check
      - name: Release automation tests
        run: bun run test:release
      - name: Infrastructure tests
        run: bun run test:infra

  workflows:
    name: Workflow validation
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Check workflow syntax and shell scripts
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

  desktop:
    if: ${{ inputs.native || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-native')) }}
    uses: ./.github/workflows/desktop.yml

  android:
    name: Android compile
    if: ${{ inputs.native || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-native')) }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile debug APK without release secrets
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

  ios:
    name: iOS compile
    if: ${{ inputs.native || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-native')) }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-js
      - name: Verify portable podspec checksums
        run: ruby scripts/ci/podspec-checksums.test.rb
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install --deployment
      - name: Compile unsigned simulator app
        working-directory: apps/mobile/ios
        run: |
          xcodebuild -workspace Aulora.xcworkspace -scheme Aulora -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-ci" ARCHS="$(uname -m)" CODE_SIGNING_ALLOWED=NO build

  secrets:
    name: Secret history scan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all Git history with reviewed fixture exceptions
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact=100

  required:
    name: Required checks
    if: always()
    needs: [quality, workflows, desktop, android, ios, secrets]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          optional = {'desktop', 'android', 'ios'}
          allowed = lambda name, job: job['result'] == 'success' or (name in optional and job['result'] == 'skipped')
          failures = [name for name, job in json.loads(os.environ['RESULTS']).items() if not allowed(name, job)]
          if failures:
              print('Required checks failed: ' + ', '.join(failures))
              sys.exit(1)
          print('All required checks passed.')
          PY
