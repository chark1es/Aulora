name: CLA bot

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]
    paths: [CLA.md]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to recheck; leave empty to check every open PR
        type: string
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number || github.event_name }}
  cancel-in-progress: false

jobs:
  acceptance:
    name: Record CLA acceptance
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')) &&
      (github.event_name != 'workflow_dispatch' ||
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job has write access. Always run trusted default-branch code,
      # never the contributor's head, merge ref, dependencies, or scripts.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/cla.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { run } = await import(pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/ci/cla.mjs`).href);
            await run({ github, context, core });
