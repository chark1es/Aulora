name: PR-Agent

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review with PR-Agent
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request_target' && !github.event.pull_request.draft) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        (startsWith(github.event.comment.body, '/review') ||
         startsWith(github.event.comment.body, '/improve') ||
         startsWith(github.event.comment.body, '/ask') ||
         startsWith(github.event.comment.body, '/describe') ||
         startsWith(github.event.comment.body, '/help'))))
    runs-on: ubuntu-latest
    environment: pr-review
    timeout-minutes: 15
    steps:
      - name: Check model credentials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo '::error::Add the OPENROUTER_API_KEY repository secret. See docs/github-actions.md#pr-agent-reviews.'
            exit 1
          fi
      # Fetch PR data through the GitHub API. Never check out or execute PR code
      # in this privileged job. Pin the Docker image itself, not its mutable tag.
      - name: Run PR-Agent
        uses: docker://pragent/pr-agent@sha256:65e5b196e38cecd7df8a71fe29942052e081a0c6645132c2ac874df60b1760c7 # 0.46.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER__KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CONFIG__MODEL: ${{ vars.PR_AGENT_MODEL || 'openrouter/deepseek/deepseek-v4.1-flash' }}
          CONFIG__MODEL_WEAK: ${{ vars.PR_AGENT_MODEL || 'openrouter/deepseek/deepseek-v4.1-flash' }}
          CONFIG__FALLBACK_MODELS: '[]'
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG__PR_ACTIONS: '["opened", "reopened", "ready_for_review"]'
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: 'true'
          GITHUB_ACTION_CONFIG__PUSH_COMMANDS: '["/review"]'
