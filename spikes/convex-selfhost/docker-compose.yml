services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: convex_local_dev
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convex -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "3210:3210"
      - "3211:3211"
    volumes:
      - data:/convex/data
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-aulora-spike}
      # INSTANCE_SECRET: stable secret for DB encryption. Generate with: openssl rand -hex 32
      - INSTANCE_SECRET=${INSTANCE_SECRET}
      # POSTGRES_URL must NOT include a database name (db name derives from INSTANCE_NAME).
      - POSTGRES_URL=postgresql://convex:convex_local_dev@postgres:5432
      - DO_NOT_REQUIRE_SSL=1
      - CONVEX_CLOUD_ORIGIN=${CONVEX_CLOUD_ORIGIN:-http://127.0.0.1:3210}
      - CONVEX_SITE_ORIGIN=${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      - RUST_LOG=${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "6791:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=${NEXT_PUBLIC_DEPLOYMENT_URL:-http://127.0.0.1:3210}
    depends_on:
      backend:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    profiles: ["keycloak"]
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Advertise a hostname reachable from other compose services (the Convex
      # backend fetches discovery/token server-side). Not browser-reachable in
      # this spike; a real deploy would use a shared public hostname.
      - KC_HOSTNAME=http://keycloak:8080
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  data:
  pgdata:
