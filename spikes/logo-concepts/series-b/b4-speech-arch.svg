<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Aulora concept B4, Speech-arch">
  <!-- Speech-arch: a rounded speech bubble (talk) whose lower-left tail carries an
       arched doorway (enter) — the arch is cut through the bubble as negative space
       and seated on an Ember sill, so the tail reads as both a pointer and a
       threshold. One Ember body plus a single Moss "new message" dot; the doorway is
       true negative space, so the mark survives a single-colour rendering. -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    style="fill: var(--ember, #C2410C)"
    d="M30 12H66A18 18 0 0 1 84 30V44A18 18 0 0 1 66 62H30A18 18 0 0 1 12 44V30A18 18 0 0 1 30 12Z M40 53V46A8 8 0 0 1 56 46V53Z"
  />
  <rect x="36" y="49" width="24" height="6" rx="3" style="fill: var(--ember, #C2410C)" />
  <path style="fill: var(--ember, #C2410C)" d="M30 62H52L24 88Z" />
  <circle cx="66" cy="27" r="4" style="fill: var(--moss, #248A3D)" />
</svg>
