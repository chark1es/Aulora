<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none" role="img" aria-label="Aulora concept B6, Initial A">
  <!-- Initial A: a geometric, rounded A drawn as three heavy round-capped strokes,
       with a small speech dot carved out of the apex as true negative space. Bold
       app-icon energy; the dot is the "voice", the A the brand. -->
  <defs>
    <mask id="b6-dot" maskUnits="userSpaceOnUse" x="0" y="0" width="96" height="96">
      <rect x="0" y="0" width="96" height="96" fill="#FFFFFF" />
      <circle cx="48" cy="28" r="5" fill="#000000" />
    </mask>
  </defs>
  <g
    mask="url(#b6-dot)"
    fill="none"
    stroke="var(--ember, #C2410C)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M32 80 48 16" />
    <path d="M64 80 48 16" />
    <path d="M36 58H60" />
  </g>
</svg>
