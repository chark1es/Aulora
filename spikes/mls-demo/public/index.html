<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ts-mls browser Worker probe</title>
  </head>
  <body style="font-family: monospace; padding: 1rem">
    <h3>ts-mls in a browser Web Worker</h3>
    <pre id="out">starting...</pre>
    <script type="module">
      const out = document.getElementById("out");
      const log = (s) => {
        out.textContent += "\n" + s;
        console.log(s);
      };
      try {
        const worker = new Worker("./worker.js", { type: "module" });
        worker.onmessage = (ev) => {
          log(JSON.stringify(ev.data, null, 2));
          document.title = ev.data.type === "result" ? "OK" : "ERROR";
        };
        worker.onerror = (err) => {
          log("WORKER ERROR: " + err.message);
          document.title = "ERROR";
        };
      } catch (e) {
        log("FAILED TO START WORKER: " + e.message);
        document.title = "ERROR";
      }
    </script>
  </body>
</html>
