# Aulora — Coolify deployment of the self-hosted Docker Compose stack.
#
# This is the file to point Coolify at. It is the same stack as
# `docker-compose.yml`, adjusted for Coolify; the operator guide lives in
# `apps/docs/content/coolify.md` and the routing contract in `proxy/README.md`.
#
# Coolify resource settings
#   Resource type ....... Docker Compose
#   Repository .......... this Git repository
#   Base Directory ...... infra/docker
#   Compose Location .... docker-compose.coolify.yml
#   Preserve Repository . ON
#       Needed so the repo-relative bind mounts below (./initdb, and ./vault for
#       the optional `ekm` profile) still exist at deploy time. Coolify removes
#       the checkout after a normal (non-preserved) deploy.
#
# Domains (Coolify "Domains" on this resource; Coolify's Traefik terminates TLS)
#   https://chat.example.com    -> service `web`            container port 80
#   https://convex.example.com  -> service `convex-backend` container port 3210
#   Optional, keep private: https://dashboard.example.com -> `convex-dashboard`
#       container port 6791 (put it behind strong auth or a VPN).
#
# Set these in Coolify's environment so the origins match the domains above:
#   SITE_URL=https://chat.example.com
#   CONVEX_CLOUD_ORIGIN=https://convex.example.com
#   CONVEX_URL=https://convex.example.com
#   CONVEX_SITE_ORIGIN=https://chat.example.com
#   TRUSTED_ORIGINS=https://chat.example.com
# `/api/auth/*` stays on the web origin: the `web` nginx proxies it to
# `convex-backend:3211`, so the Better Auth session cookie is first-party. Do
# not move it to the Convex domain.
#
# Secret persistence (read this)
#   `setup` generates INSTANCE_SECRET, BETTER_AUTH_SECRET, VAPID_* and the
#   master key AULORA_ENCRYPTION_KEY, then writes them to /host/.env. Under
#   Coolify /host is the persistent `setup-state` named volume, and the setup
#   entrypoint re-reads those values on every run. That is what makes a
#   redeploy reuse the same keys instead of silently regenerating
#   AULORA_ENCRYPTION_KEY, which would make existing ciphertext unreadable.
#   - Do NOT delete the `setup-state` volume on down/redeploy.
#   - Keep an offline backup of AULORA_ENCRYPTION_KEY (the KEK): losing it makes
#     the data unreadable. See `apps/docs/content/coolify.md`.
#   - You may also set the generated values explicitly in Coolify's environment;
#     an explicit value always wins over the volume.
#
# Only `web` and `convex-backend` need a Coolify domain. Every other service is
# internal-only: no host `ports:` are published here on purpose. Coolify routes
# a domain to `<service>:<container port>`; it does not need published ports.
#
# Profiles: Coolify does not start profiled services, so `backups`, `ekm` and
# `push-relay` stay off. To enable one, run this compose file with the profile as
# a separate Coolify resource (same repository + Base Directory + Compose
# Location, with the profile added), or on the host:
#   docker compose -f docker-compose.coolify.yml --profile backups up -d
#
# Image pinning policy matches docker-compose.yml; see README.md "Pinned images".

# No top-level `name:` on purpose: Coolify sets the Compose project name, and
# that name also prefix-names the `setup-state` volume. Removing the pin here
# avoids overriding Coolify's naming. (For a standalone run, export
# COMPOSE_PROJECT_NAME=aulora if you want the old names.)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulora-postgres}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convex} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  # One-shot: creates the database Convex expects (INSTANCE_NAME with dashes
  # replaced by underscores). Idempotent. See initdb/.
  postgres-init:
    image: postgres:17-alpine
    restart: "no"
    # One-shot service: exit is expected, so do not fail the Coolify health gate.
    exclude_from_hc: true
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-aulora}
      POSTGRES_USER: ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulora-postgres}
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./initdb:/initdb:ro
    # postgres runs initdb as the non-root `postgres` user.
    user: postgres
    entrypoint: ["/bin/bash", "/initdb/01-create-convex-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  minio:
    # Last AGPL MinIO release, repackaged; see README.md "Object storage".
    image: sourcemation/minio:RELEASE.2025-10-15T17-29-55Z-20260920
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aulora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging: *logging

  # One-shot: waits for MinIO, then creates the buckets Convex expects.
  minio-init:
    image: docker.io/pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: "no"
    exclude_from_hc: true
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aulora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
      S3_STORAGE_EXPORTS_BUCKET: ${S3_STORAGE_EXPORTS_BUCKET:-convex-snapshot-exports}
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}
      S3_STORAGE_MODULES_BUCKET: ${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      S3_STORAGE_FILES_BUCKET: ${S3_STORAGE_FILES_BUCKET:-convex-user-files}
      S3_STORAGE_SEARCH_BUCKET: ${S3_STORAGE_SEARCH_BUCKET:-convex-search-indexes}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        until mc alias set aulora http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "minio-init: waiting for MinIO..."
          sleep 3
        done
        for bucket in \
          "$$S3_STORAGE_EXPORTS_BUCKET" \
          "$$S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET" \
          "$$S3_STORAGE_MODULES_BUCKET" \
          "$$S3_STORAGE_FILES_BUCKET" \
          "$$S3_STORAGE_SEARCH_BUCKET"; do
          mc mb --ignore-existing "aulora/$$bucket" >/dev/null
        done
        echo "minio-init: buckets ready"
    depends_on:
      minio:
        condition: service_healthy
    logging: *logging

  convex-backend:
    # Pinned by digest: Convex revision 0cf49cbf8c4b7e22e631ceda9b5111f6cccbcd49.
    image: ghcr.io/get-convex/convex-backend@sha256:b756b06641d15a55b5ec0692897ce5ad3715ddccfd02e1e213621e9e764255c8
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-aulora}
      # Blank lets the backend generate and persist one in the data volume;
      # `setup` records it back into the setup-state volume. See README.md.
      INSTANCE_SECRET: ${INSTANCE_SECRET}
      # POSTGRES_URL must NOT include a database name.
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://convex:aulora-postgres@postgres:5432}
      DO_NOT_REQUIRE_SSL: ${DO_NOT_REQUIRE_SSL:-1}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://convex-backend:3211}
      RUST_LOG: ${RUST_LOG:-info}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-aulora}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      AWS_S3_DISABLE_CHECKSUMS: ${AWS_S3_DISABLE_CHECKSUMS:-true}
      AWS_S3_DISABLE_SSE: ${AWS_S3_DISABLE_SSE:-true}
      S3_STORAGE_EXPORTS_BUCKET: ${S3_STORAGE_EXPORTS_BUCKET:-convex-snapshot-exports}
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}
      S3_STORAGE_MODULES_BUCKET: ${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      S3_STORAGE_FILES_BUCKET: ${S3_STORAGE_FILES_BUCKET:-convex-user-files}
      S3_STORAGE_SEARCH_BUCKET: ${S3_STORAGE_SEARCH_BUCKET:-convex-search-indexes}
      AULORA_ENCRYPTION_ENABLED: ${AULORA_ENCRYPTION_ENABLED:-true}
      AULORA_EKM_PROVIDER: ${AULORA_EKM_PROVIDER:-local}
      AULORA_EKM_KEY_ID: ${AULORA_EKM_KEY_ID:-aulora-kek}
      AULORA_ENCRYPTION_KEY_VERSION: ${AULORA_ENCRYPTION_KEY_VERSION:-1}
      AULORA_ENCRYPTION_KEY: ${AULORA_ENCRYPTION_KEY:-}
      AULORA_KEK_WRAPPED: ${AULORA_KEK_WRAPPED:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      GCP_KMS_KEY_NAME: ${GCP_KMS_KEY_NAME:-}
      EKM_PROXY_URL: ${EKM_PROXY_URL:-}
      EKM_PROXY_TOKEN: ${EKM_PROXY_TOKEN}
    # Coolify maps the Convex domain to these container ports; no host ports.
    expose:
      - "3210"
      - "3211"
    volumes:
      - convex-data:/convex/data
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3210/version >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  convex-dashboard:
    # Pinned by digest (the dashboard image has no stable version tag).
    image: ghcr.io/get-convex/convex-dashboard@sha256:4ebaebfd300c203753e5016be459a2408d1655b81beeb2b793229a6878f1ac45
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
    depends_on:
      convex-backend:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        INSTANCE_NAME: ${INSTANCE_NAME:-Aulora}
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
    image: aulora-web:local
    restart: unless-stopped
    # Coolify maps the web domain to this container's port 80; no host ports.
    expose:
      - "80"
    volumes:
      # The real per-instance well-known document is written here by `setup`.
      - web-well-known:/var/www/.well-known:ro
    depends_on:
      convex-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  # One-shot first-run tool. Idempotent: safe to re-run any time. Coolify does
  # not run profiled services, but this one is unprofiled and runs on deploy.
  setup:
    build:
      context: ../..
      dockerfile: infra/docker/setup.Dockerfile
    image: aulora-setup:local
    restart: "no"
    exclude_from_hc: true
    # Optional fallback for hosts that still provide a compose .env. Under
    # Coolify the environment below is the source of truth.
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /convex/data
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_HTTP_URL: http://convex-backend:3211
      CONVEX_PROJECT_DIR: /app/packages/convex
      HOST_ENV_FILE: /host/.env
      WELL_KNOWN_DIR: /web-well-known
      # --- instance identity + owner (operator-required) ---
      INSTANCE_NAME: ${INSTANCE_NAME:-aulora}
      WORKSPACE_NAME: ${WORKSPACE_NAME:-Aulora}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_NAME: ${OWNER_NAME:-}
      # --- public origins (operator-required) ---
      SITE_URL: ${SITE_URL:-}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-}
      CONVEX_URL: ${CONVEX_URL:-}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      # --- generated secrets (blank = generate + persist; set = stable) ---
      INSTANCE_SECRET: ${INSTANCE_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      SETUP_TOKEN: ${SETUP_TOKEN}
      # --- auth ---
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      AUTH_LOCAL_SIGNUP: ${AUTH_LOCAL_SIGNUP:-true}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_GROUP_CLAIM: ${OIDC_GROUP_CLAIM:-}
      OIDC_GROUP_ROLE_MAP: ${OIDC_GROUP_ROLE_MAP:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:owner@example.com}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # --- encryption (EKM config + optional remote providers) ---
      AULORA_ENCRYPTION_ENABLED: ${AULORA_ENCRYPTION_ENABLED:-true}
      AULORA_EKM_PROVIDER: ${AULORA_EKM_PROVIDER:-local}
      AULORA_EKM_KEY_ID: ${AULORA_EKM_KEY_ID:-aulora-kek}
      AULORA_ENCRYPTION_KEY_VERSION: ${AULORA_ENCRYPTION_KEY_VERSION:-1}
      AULORA_ENCRYPTION_KEY: ${AULORA_ENCRYPTION_KEY:-}
      AULORA_KEK_WRAPPED: ${AULORA_KEK_WRAPPED:-}
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_KMS_KEY_ID: ${AWS_KMS_KEY_ID:-}
      GCP_KMS_KEY_NAME: ${GCP_KMS_KEY_NAME:-}
      EKM_PROXY_URL: ${EKM_PROXY_URL:-}
      EKM_PROXY_TOKEN: ${EKM_PROXY_TOKEN}
    volumes:
      - convex-data:/convex/data
      - web-well-known:/web-well-known
      # Persistent secret state: `setup` writes generated secrets here and
      # re-reads them on later runs, so redeploys keep the same keys. This
      # replaces the host bind `./:/host` in docker-compose.yml.
      - setup-state:/host
    depends_on:
      convex-backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging: *logging

  # Optional project push relay for official store builds. Profile `push-relay`.
  push-relay:
    build:
      context: ../push-relay
      dockerfile: Dockerfile
    image: aulora-push-relay:local
    profiles: ["push-relay"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUSH_RELAY_PORT: 8790
      PUSH_RELAY_URL: ${PUSH_RELAY_URL:-}
      PUSH_RELAY_TOKEN: ${PUSH_RELAY_TOKEN}
      AULORA_SERVER_ID: ${AULORA_SERVER_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-dev.spwnd.aulora}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_PATH: ${APNS_KEY_PATH:-}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      FCM_ACCESS_TOKEN: ${FCM_ACCESS_TOKEN}
      UNIFIEDPUSH_ENABLED: ${UNIFIEDPUSH_ENABLED:-}
    expose:
      - "8790"
    logging: *logging

  # Optional nightly backup runner. Profile `backups`.
  backup:
    build:
      context: ../..
      dockerfile: infra/docker/backup/backup.Dockerfile
    image: aulora-backup:local
    profiles: ["backups"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /convex/data
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_PROJECT_DIR: /app/packages/convex
      HOST_ENV_FILE: /host/.env
      BACKUP_DIR: /backup
      BACKUP_PLAN: /app/backup/backup-plan.mjs
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-3}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-aulora-backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-7}
      BACKUP_TOKEN: ${BACKUP_TOKEN}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulora-postgres}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-aulora}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
    volumes:
      - convex-data:/convex/data
      - backup-data:/backup
      # Shares the persistent secret state (BACKUP_TOKEN lives here).
      - setup-state:/host
    depends_on:
      convex-backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    logging: *logging

  # Optional external key manager (HashiCorp Vault dev mode). Profile `ekm`.
  vault:
    image: hashicorp/vault:1.18
    profiles: ["ekm"]
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    logging: *logging

  # One-shot: enables the transit engine, creates the KEK and (when a local key
  # is present) wraps it into AULORA_KEK_WRAPPED in the setup-state volume.
  vault-init:
    image: hashicorp/vault:1.18
    profiles: ["ekm"]
    restart: "no"
    exclude_from_hc: true
    env_file:
      - path: .env
        required: false
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_TRANSIT_MOUNT: ${VAULT_TRANSIT_MOUNT:-transit}
      AULORA_EKM_KEY_ID: ${AULORA_EKM_KEY_ID:-aulora-kek}
      HOST_ENV_FILE: /host/.env
    volumes:
      - ./vault:/vault:ro
      # Shares the persistent secret state.
      - setup-state:/host
    entrypoint: ["/bin/sh", "/vault/init.sh"]
    depends_on:
      vault:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    logging: *logging

volumes:
  pgdata:
  convex-data:
  minio-data:
  web-well-known:
  backup-data:
  # Persists generated secrets across redeploys. Back this up (it holds the KEK
  # AULORA_ENCRYPTION_KEY); losing it makes existing ciphertext unreadable.
  setup-state:
