# Aulora — self-hosted Docker Compose stack (Phase 1, task 4).
#
# Proxy-agnostic: there is deliberately no TLS terminator here. Operators put
# this behind their own edge (Coolify, Traefik, Caddy, nginx, a cloud LB). See
# `proxy/README.md` for the routing contract and ready-made configs.
#
# Image pinning policy (see README.md "Pinned images"):
#   - Convex backend/dashboard only publish `latest` + commit tags, so they are
#     pinned by immutable digest (the digests match Convex revision 0cf49cbf).
#   - Everything else is pinned to an explicit release tag.
#
# First run:
#   cp .env.example .env        # then edit owner + workspace values
#   docker compose up -d --build
#   docker compose run --rm setup
#   open http://localhost:8080

name: ${COMPOSE_PROJECT_NAME:-aulora}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulora-postgres}
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-convex} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    logging: *logging

  # One-shot: creates the database Convex expects (INSTANCE_NAME with dashes
  # replaced by underscores). Idempotent and needed on a fresh volume because
  # mere env vars cannot reach a nested connection string. See initdb/.
  postgres-init:
    image: postgres:17-alpine
    restart: "no"
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-aulora}
      POSTGRES_USER: ${POSTGRES_USER:-convex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aulora-postgres}
      PGHOST: postgres
      PGPORT: "5432"
    volumes:
      - ./initdb:/initdb:ro
    # postgres runs initdb as the non-root `postgres` user.
    user: postgres
    entrypoint: ["/bin/bash", "/initdb/01-create-convex-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  minio:
    # MinIO's community images were pulled from Docker Hub in late 2025; the
    # last AGPL release lives on in this packager image. See README.md
    # "Object storage" for the supply-chain note and how to point at any S3.
    image: sourcemation/minio:RELEASE.2025-10-15T17-29-55Z-20260920
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aulora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    logging: *logging

  # One-shot: waits for MinIO, then creates the buckets Convex expects.
  # Idempotent (`mc mb --ignore-existing`).
  minio-init:
    image: docker.io/pgsty/mc@sha256:cfc83108c3abb371f8fb84d99c1fdc88f8c237e022409b0081fb7c0a3be634dd
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aulora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
      S3_STORAGE_EXPORTS_BUCKET: ${S3_STORAGE_EXPORTS_BUCKET:-convex-snapshot-exports}
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}
      S3_STORAGE_MODULES_BUCKET: ${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      S3_STORAGE_FILES_BUCKET: ${S3_STORAGE_FILES_BUCKET:-convex-user-files}
      S3_STORAGE_SEARCH_BUCKET: ${S3_STORAGE_SEARCH_BUCKET:-convex-search-indexes}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        until mc alias set aulora http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          echo "minio-init: waiting for MinIO..."
          sleep 3
        done
        for bucket in \
          "$$S3_STORAGE_EXPORTS_BUCKET" \
          "$$S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET" \
          "$$S3_STORAGE_MODULES_BUCKET" \
          "$$S3_STORAGE_FILES_BUCKET" \
          "$$S3_STORAGE_SEARCH_BUCKET"; do
          mc mb --ignore-existing "aulora/$$bucket" >/dev/null
        done
        echo "minio-init: buckets ready"
    depends_on:
      minio:
        condition: service_healthy
    logging: *logging

  convex-backend:
    # Pinned by digest: Convex revision 0cf49cbf8c4b7e22e631ceda9b5111f6cccbcd49.
    image: ghcr.io/get-convex/convex-backend@sha256:b756b06641d15a55b5ec0692897ce5ad3715ddccfd02e1e213621e9e764255c8
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-aulora}
      # Leave blank to let the backend generate and persist one in the data
      # volume; `setup` records it back into .env. See README.md.
      INSTANCE_SECRET: ${INSTANCE_SECRET:-}
      # POSTGRES_URL must NOT include a database name; the backend connects to
      # the database named after INSTANCE_NAME.
      POSTGRES_URL: ${POSTGRES_URL:-postgresql://convex:aulora-postgres@postgres:5432}
      DO_NOT_REQUIRE_SSL: ${DO_NOT_REQUIRE_SSL:-1}
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://convex-backend:3211}
      RUST_LOG: ${RUST_LOG:-info}
      # S3 / MinIO storage. Remove the S3_* block (and AWS_*) to fall back to
      # the backend's local volume storage instead.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-aulora}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-aulora-minio-secret}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      # MinIO (and most S3-compatible stores) need path-style addressing
      # (`minio:9000/bucket`, not `bucket.minio:9000`) and do not implement the
      # newer payload checksums / SSE headers the AWS SDK sends by default.
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-true}
      AWS_S3_DISABLE_CHECKSUMS: ${AWS_S3_DISABLE_CHECKSUMS:-true}
      AWS_S3_DISABLE_SSE: ${AWS_S3_DISABLE_SSE:-true}
      S3_STORAGE_EXPORTS_BUCKET: ${S3_STORAGE_EXPORTS_BUCKET:-convex-snapshot-exports}
      S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET: ${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}
      S3_STORAGE_MODULES_BUCKET: ${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      S3_STORAGE_FILES_BUCKET: ${S3_STORAGE_FILES_BUCKET:-convex-user-files}
      S3_STORAGE_SEARCH_BUCKET: ${S3_STORAGE_SEARCH_BUCKET:-convex-search-indexes}
    volumes:
      - convex-data:/convex/data
    ports:
      - "${CONVEX_API_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3210/version >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  convex-dashboard:
    # Pinned by digest (Convex dashboard image has no stable version tag).
    image: ghcr.io/get-convex/convex-dashboard@sha256:4ebaebfd300c203753e5016be459a2408d1655b81beeb2b793229a6878f1ac45
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
    ports:
      - "${DASHBOARD_PORT:-6791}:6791"
    depends_on:
      convex-backend:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        INSTANCE_NAME: ${INSTANCE_NAME:-Aulora}
        SITE_URL: ${SITE_URL:-http://localhost:8080}
        CONVEX_URL: ${CONVEX_CLOUD_ORIGIN:-http://localhost:3210}
    image: aulora-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      # The real per-instance well-known document is written here by `setup`.
      - web-well-known:/var/www/.well-known:ro
    depends_on:
      convex-backend:
        condition: service_healthy
    logging: *logging

  # One-shot first-run tool. Idempotent: safe to re-run any time.
  setup:
    build:
      context: ../..
      dockerfile: infra/docker/setup.Dockerfile
    image: aulora-setup:local
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /convex/data
      CONVEX_SELF_HOSTED_URL: http://convex-backend:3210
      CONVEX_HTTP_URL: http://convex-backend:3211
      CONVEX_PROJECT_DIR: /app/packages/convex
      HOST_ENV_FILE: /host/.env
      WELL_KNOWN_DIR: /web-well-known
    volumes:
      - convex-data:/convex/data
      - web-well-known:/web-well-known
      # Write generated secrets back to infra/docker/.env on the host.
      - ./:/host
    depends_on:
      convex-backend:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    logging: *logging

  # Optional project push relay for official store builds. Holds APNs/FCM
  # credentials and forwards content-free wakeups only. Enable with
  # `--profile push-relay`; configure PUSH_RELAY_* and any provider keys in .env.
  push-relay:
    build:
      context: ../push-relay
      dockerfile: Dockerfile
    image: aulora-push-relay:local
    profiles: ["push-relay"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PUSH_RELAY_PORT: 8790
    ports:
      - "${PUSH_RELAY_PORT:-8790}:8790"
    logging: *logging

volumes:
  pgdata:
  convex-data:
  minio-data:
  web-well-known:
