# Aulora web container: static SPA + the two routes that must be first-party.
#
# Routing contract (see ../proxy/README.md for the production edge):
#   /                 -> the built SPA, with history fallback
#   /.well-known/*    -> the per-instance well-known document (mounted volume)
#   /api/auth/*       -> Convex HTTP actions (convex-backend:3211), same origin,
#                        so the Better Auth session cookie is first-party.
#
# Operators may move the /api/auth proxy to their edge proxy instead; in that
# case point this location at the edge/Gateway or leave it and let the edge
# handle it ahead of this container.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Do not leak the nginx version.
  server_tokens off;

  client_max_body_size 25m;

  # Public per-instance document, written by the `setup` container into the
  # `web-well-known` volume mounted at /var/www/.well-known.
  location ^~ /.well-known/ {
    root /var/www;
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # First-party auth. Keep Set-Cookie, Origin and forwarding headers intact.
  location /api/auth/ {
    proxy_pass http://convex-backend:3211;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Baseline security headers. The full policy (HSTS, CSP at the edge) lives in
  # proxy/README.md; these are safe defaults even without an edge.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
